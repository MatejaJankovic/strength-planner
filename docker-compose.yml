services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-strengthplanner}
      POSTGRES_USER: ${POSTGRES_USER:-strengthplanner}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-strengthplanner_password}
    volumes:
      - strengthplanner_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: src/StrengthPlanner.API/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Host=db;Port=5432;Database=${POSTGRES_DB:-strengthplanner};Username=${POSTGRES_USER:-strengthplanner};Password=${POSTGRES_PASSWORD:-strengthplanner_password}
      Jwt__Issuer: ${JWT_ISSUER:-StrengthPlanner}
      Jwt__Audience: ${JWT_AUDIENCE:-StrengthPlanner.Client}
      Jwt__Key: ${JWT_KEY:-}
      Jwt__ExpiryMinutes: ${JWT_EXPIRY_MINUTES:-60}
    ports:
      - "${API_PORT:-5000}:8080"

  web:
    build:
      context: ./strength-planner-web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:80"

volumes:
  strengthplanner_pgdata:
