# Provere koje su do sada postojale samo kao navika: build, testovi i pregled zavisnosti.
#
# Postoje zato što je „provereno jednom" nešto sasvim drugo od „proverava se". Nalaz iz
# skeniranja zavisnosti stari sam od sebe — paket koji je danas čist objavi ranjivost
# sledeće nedelje, bez ijedne izmene u ovom repozitorijumu. Zato ovo radi i po rasporedu, a
# ne samo na izmenu.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Ponedeljkom ujutru: hvata ranjivosti objavljene u međuvremenu, bez ijednog commita.
    - cron: "0 6 * * 1"

permissions:
  contents: read

jobs:
  backend:
    name: .NET build i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          # global.json drži verziju; ovde se ne ponavlja da se ne bi razišle.
          global-json-file: global.json

      - run: dotnet restore

      - run: dotnet build --no-restore --configuration Release

      - run: dotnet test --no-build --configuration Release --verbosity normal

  frontend:
    name: Angular build i testovi
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: strength-planner-web/package-lock.json

      - run: npm ci
        working-directory: strength-planner-web

      - run: npm run build
        working-directory: strength-planner-web

      - run: npm test
        working-directory: strength-planner-web

  dependencies:
    name: Ranjive zavisnosti
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: strength-planner-web/package-lock.json

      - run: dotnet restore

      # `dotnet list package --vulnerable` uvek izlazi sa nulom, pa nalaz mora da se
      # pročita iz ispisa — bez ovoga bi korak bio zelen i kada nešto nađe.
      - name: dotnet list package --vulnerable
        run: |
          dotnet list package --vulnerable --include-transitive > vulnerable.txt 2>&1
          cat vulnerable.txt
          if grep -qiE "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Ranjivi NuGet paketi — vidi ispis iznad."
            exit 1
          fi

      - run: npm ci
        working-directory: strength-planner-web

      # Ono što se isporučuje mora da bude čisto: ovaj korak obara build.
      - name: npm audit (isporučene zavisnosti)
        run: npm audit --omit=dev --audit-level=low
        working-directory: strength-planner-web

      # Razvojne zavisnosti se ne isporučuju korisniku, pa nalaz ovde prijavljuje a ne
      # obara — inače bi ranjivost u alatu zaustavila rad na aplikaciji.
      - name: npm audit (uključujući razvojne)
        run: npm audit || true
        working-directory: strength-planner-web

  secrets:
    name: Tajne u istoriji
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Cela istorija: smisao je da se uhvati i tajna koja je ušla ranije pa je
          # kasnije uklonjena iz radnog stabla — u istoriji ostaje.
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
