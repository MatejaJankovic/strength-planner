# Bezbednosna zaglavlja, izdvojena zato što se u nginx-u `add_header` iz spoljašnjeg
# bloka NE nasleđuje u `location` koji ima svoj `add_header`. Da su ostala samo u
# `server` bloku, nestala bi upravo tamo gde su najpotrebnija — na index.html i na
# skriptama, jer ti blokovi postavljaju Cache-Control. Zato se uključuju svuda.
#
# JWT stoji u localStorage, pa je CSP glavna prepreka koja bi jednu XSS rupu sprečila
# da odmah postane krađa tokena. Aplikacija trenutno nema XSS — Angular podrazumevano
# enkodira i nigde nema innerHTML ni bypassSecurityTrust* — ali ovo je jeftin sloj
# odbrane za ubuduće.
#
# 'unsafe-inline' za stilove je nužno jer Angular Material ubacuje inline stilove.
# Skripte ga NEMAJU, a to je deo koji zaista štiti.
# fonts.googleapis.com / fonts.gstatic.com su na spisku jer index.html odatle učitava
# Inter, Space Grotesk i Material Icons. Bolje rešenje je da se ti fontovi posluže sa
# istog porekla — tada i ova dva izvora mogu da ispadnu iz pravila, aplikacija radi bez
# interneta, a IP adresa korisnika ne odlazi trećoj strani. Vidi docs/deployment-security.md.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# HSTS se namerno NE šalje: preko čistog HTTP-a ga pregledači ignorišu, a ako se
# aplikacija ikada posluži preko HTTP-a posle HTTPS-a, zaključao bi je. Uključuje se
# zajedno sa TLS-om — vidi docs/deployment-security.md.
