# Ne objavljuj verziju nginx-a u Server zaglavlju i stranicama greške.
server_tokens off;

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /api {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fajlovi sa heš-om u imenu se ne menjaju, pa smeju da se keširaju dugo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html se menja pri svakoj izmeni aplikacije. Bez ovoga ga pregledač kešira
    # heuristički, pa korisnik posle nadogradnje ostaje na staroj verziji — uključujući
    # i staru verziju bezbednosnih ispravki.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
