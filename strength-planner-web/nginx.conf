# Ne objavljuj verziju nginx-a u Server zaglavlju i stranicama greške.
server_tokens off;

# Šema originalnog zahteva, a ne poslednjeg skoka.
#
# Kada TLS stoji ispred (docker-compose.tls.yml), lanac je klijent → Caddy → nginx → API.
# Caddy prekida TLS i dalje šalje čist HTTP, pa je ovde $scheme uvek "http". Slanje $scheme
# bi prepisalo "https" koje je Caddy postavio, i API bi svaki zahtev video kao HTTP: HSTS
# se tada nikada ne šalje, a preusmeravanje na HTTPS bi ušlo u petlju.
#
# Zato: ako je zaglavlje već stiglo, prosledi ga; ako nije, nema proxy-ja ispred pa važi
# naša sopstvena šema.
map $http_x_forwarded_proto $forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/snippets/security-headers.conf;

    location = /api {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    location /api/ {
        include /etc/nginx/snippets/security-headers.conf;
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # Fajlovi sa heš-om u imenu se ne menjaju, pa smeju da se keširaju dugo.
    location ~* \.(?:js|css|woff2?|png|jpg|jpeg|svg|ico)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
    }

    # index.html se menja pri svakoj izmeni aplikacije. Bez ovoga ga pregledač kešira
    # heuristički, pa korisnik posle nadogradnje ostaje na staroj verziji — uključujući
    # i staru verziju bezbednosnih ispravki.
    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
