<section class="empty-state">
  <mat-icon aria-hidden="true">{{ icon() }}</mat-icon>
  <div>
    <h2>{{ title() }}</h2>
    <p>{{ message() }}</p>
  </div>

  @if (action()) {
    <button class="empty-state__action" type="button" (click)="actionClick.emit()">
      {{ action() }}
    </button>
  }
</section>
