@if (editing()) {
  <div class="note note--editing">
    <label class="note__label" [for]="fieldId">{{ label() }}</label>
    <textarea
      #field
      class="note__input"
      [id]="fieldId"
      rows="3"
      [maxLength]="maxLength"
      [value]="draft()"
      [attr.aria-describedby]="error() ? fieldId + '-count ' + fieldId + '-error' : fieldId + '-count'"
      (input)="setDraft(field.value)"
      [disabled]="saving()"
    ></textarea>
    <p class="note__count" [id]="fieldId + '-count'" [class.note__count--full]="draft().length >= maxLength">
      {{ draft().length }} / {{ maxLength }}
    </p>

    @if (error(); as message) {
      <p class="note__error" role="alert" [id]="fieldId + '-error'">{{ message }}</p>
    }

    <div class="note__actions">
      <button type="button" class="note__btn note__btn--primary" [disabled]="saving()" (click)="save()">
        {{ saving() ? 'Čuvam…' : 'Sačuvaj' }}
      </button>
      <button type="button" class="note__btn" [disabled]="saving()" (click)="cancel()">Otkaži</button>
    </div>
  </div>
} @else if (saved(); as text) {
  <div class="note">
    <p class="note__label">{{ label() }}</p>
    <p class="note__text">{{ text }}</p>
    <!-- Na ekranu ima više dugmadi „Izmeni" (jedna po kartici): čitač ekrana mora da zna uz šta. -->
    <button type="button" class="note__btn" [attr.aria-label]="'Izmeni: ' + label().toLowerCase()" (click)="edit()">
      <mat-icon aria-hidden="true">edit</mat-icon>
      Izmeni
    </button>
  </div>
} @else {
  <button type="button" class="note__btn note__btn--add" (click)="edit()">
    <mat-icon aria-hidden="true">edit_note</mat-icon>
    {{ addLabel() }}
  </button>
}
